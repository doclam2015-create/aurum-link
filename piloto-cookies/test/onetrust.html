<!doctype html><html><head><meta charset="utf-8"><title>OneTrust</title>
<style>body{height:3000px}#onetrust-banner-sdk{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #333;padding:20px;z-index:99}#onetrust-pc-sdk{display:none;position:fixed;inset:10%;background:#eee;z-index:100}</style></head>
<body class="ot-overflow-hidden" style="overflow:hidden"><h1>Sitio con OneTrust</h1>
<div id="onetrust-consent-sdk"><div id="onetrust-banner-sdk"><p>Usamos cookies para mejorar tu experiencia.</p>
<button id="onetrust-pc-btn-handler">Configurar</button><button id="onetrust-reject-all-handler">Rechazar todas</button><button id="onetrust-accept-btn-handler">Aceptar todas</button></div>
<div id="onetrust-pc-sdk"><input type="checkbox" id="ot-group-id-C0002" checked><input type="checkbox" id="ot-group-id-C0003" checked><input type="checkbox" id="ot-group-id-C0004" checked><button class="save-preference-btn-handler">Guardar</button></div></div>
<script>
const b=document.getElementById('onetrust-banner-sdk'),pc=document.getElementById('onetrust-pc-sdk');
function done(v){window.RESULT=v;b.style.display='none';pc.style.display='none';}
document.getElementById('onetrust-reject-all-handler').onclick=()=>done('reject');
document.getElementById('onetrust-accept-btn-handler').onclick=()=>done('accept');
document.getElementById('onetrust-pc-btn-handler').onclick=()=>{b.style.display='none';pc.style.display='block'};
document.querySelector('.save-preference-btn-handler').onclick=()=>done('custom:'+['C0002','C0003','C0004'].map(c=>document.getElementById('ot-group-id-'+c).checked?1:0).join(''));
</script></body></html>
