<!doctype html><html><head><meta charset="utf-8"><title>Cookiebot</title>
<style>#CybotCookiebotDialog{position:fixed;inset:auto 0 0 0;background:#fff;padding:30px;box-shadow:0 0 20px #0005}</style></head>
<body><h1>Sitio con Cookiebot (API)</h1>
<div id="CybotCookiebotDialog"><p>Este sitio usa cookies</p><button id="CybotCookiebotDialogBodyButtonDecline">Denegar</button><button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll">Permitir todas</button></div>
<script>
window.Cookiebot={submitCustomConsent(p,s,m){window.RESULT='api:'+[p,s,m].map(Number).join('');document.getElementById('CybotCookiebotDialog').remove();}};
document.getElementById('CybotCookiebotDialogBodyButtonDecline').onclick=()=>{window.RESULT='click-reject';document.getElementById('CybotCookiebotDialog').remove();};
</script></body></html>
