<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurum Link">
<meta name="theme-color" content="#0a0510">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/symbols.webp" as="image" type="image/webp">
<link rel="preload" href="assets/themes.webp" as="image" type="image/webp">
<link rel="preload" href="assets/wolf.webp" as="image" type="image/webp">
<link rel="stylesheet" href="css/app.css?v=75">
<title>Aurum Link</title>
</head>
<body data-game="xlink">
<div id="app">
  <header class="top">
    <button id="btnLobby" class="icon" aria-label="Elegir juego"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
    <div class="logo"><span id="gameName">Aurum Link</span><small id="gameTag"></small></div>
    <button id="btnTheme" class="icon" aria-label="Modo claro u oscuro"><svg viewBox="0 0 24 24"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><g class="sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2"/></g></svg></button>
    <button id="btnSettings" class="icon" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5.1 1.9 1.5-2 3.4-2.3-.8a8 8 0 0 1-1.9 1.1L15.7 21h-4l-.4-2.4a8 8 0 0 1-1.9-1.1l-2.3.8-2-3.4 1.9-1.5a8 8 0 0 1 0-2.2L5.1 9.7l2-3.4 2.3.8a8 8 0 0 1 1.9-1.1L11.7 3.6h4l.4 2.4a8 8 0 0 1 1.9 1.1l2.3-.8 2 3.4-1.9 1.5a8 8 0 0 1 0 2.2z" fill-rule="evenodd"/></svg></button>
    <button id="btnSound" class="icon" aria-label="Sonido"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="wave" d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2"/><path class="mute" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2"/></svg></button>
  </header>
  <section id="pots" class="pots" aria-label="Jackpots"></section>
  <section class="board" id="board"><canvas id="stage" aria-label="Rodillos"></canvas></section>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <section class="hud">
    <div class="meters">
      <div class="meter"><span>CRÉDITO</span><b id="credit">$0</b></div>
      <div class="meter bet">
        <button id="betDown" aria-label="Bajar apuesta">−</button>
        <div><span>APUESTA</span><b id="bet">$0</b></div>
        <button id="betUp" aria-label="Subir apuesta">+</button>
      </div>
      <div class="meter"><span>PREMIO</span><b id="win">$0</b></div>
    </div>
    <div class="controls">
      <button id="btnInfo" class="ctl"><b>i</b><small>PAGOS</small></button>
      <button id="btnAuto" class="ctl"><b>AUTO</b><small id="autoCount"></small></button>
      <button id="btnSpin" class="spin" aria-label="Girar"><span class="ring"></span><span id="spinLabel">GIRAR</span><small id="spinSub"></small></button>
      <button id="btnTurbo" class="ctl"><b>⚡ <span id="speedVal">1×</span></b><small>VELOCIDAD</small></button>
      <button id="btnExtra" class="ctl extra" hidden><b id="extraLabel">BONO</b><small id="extraSub"></small></button>
    </div>
  </section>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="lobby" class="lobby">
  <div class="lobby-inner">
    <div class="lobby-head">
      <div class="brand">AURUM <span>LINK</span></div>
      <button id="lobbyClose" class="icon" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.5"/></svg></button>
    </div>
    <p class="lobby-sub">Elige tu máquina · cada una con una dinámica distinta</p>
    <div id="lobbyGrid" class="lobby-grid"></div>
    <button id="btnInstall" class="install">⬆︎ Instalar en iPhone / iPad</button>
    <p class="fine">Créditos ficticios · sin dinero real · sin compras · <span id="verLabel"></span></p>
  </div>
</div>

<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" class="icon" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.5"/></svg></button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="loader"><div class="brand">AURUM <span>LINK</span></div><div class="bar"><i></i></div></div>
<script type="module" src="js/app.js?v=75"></script>
</body>
</html>
